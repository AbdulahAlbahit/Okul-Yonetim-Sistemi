services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=abdulah123A
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql

  web_api:
    build:
      context: .
      dockerfile: WepApi/Dockerfile
    restart: on-failure
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=database;Database=SchoolMangementSystem;User Id=sa;Password=abdulah123A;TrustServerCertificate=True;
    ports:
      - "8080:8080"
    depends_on:
      - database

volumes:
  mssql_data: